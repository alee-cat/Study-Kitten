#.github/workflows/build-check.yml

name: Build Check

on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]
    
permissions:
  contents: read
  
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the server Docker image
        run: docker build -t studykitten-server:ci ./server
      - name: Confirm the image was built
        run: docker image inspect studykitten-server:ci --format 'Built {{.Id}} ({{.Architecture}}, {{.Size}} bytes)'