# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
        working-directory: server
        
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - name: Create test env file
        working-directory: server
        run: |
          printf '%s\n' \
            'MONGODB_URI=mongodb://localhost:27017/studykitten_test' \
            'ACCESS_TOKEN_SECRET=ci-access-secret' \
            'REFRESH_TOKEN_SECRET=ci-refresh-secret' \
            > .env.test
      - name: Show env file keys
        working-directory: server
        run: cut -d= -f1 .env.test
      - run: npm test
        working-directory: server